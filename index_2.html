<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保護犬譲渡サイト：こうめ</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Yomogi', cursive, sans-serif;
      background-color: #0f1e36;
      color: #f0f8ff;
    }
  </style>
</head>

<body class="min-h-screen py-8 px-4 md:px-8 flex flex-col items-center">
  <div class="max-w-5xl w-full space-y-4">

    <!-- 1. 紹介文：上 -->
    <div class="bg-sky-950/40 p-4 md:p-5 rounded-xl border border-sky-800/80 space-y-3">
      <h2 class="text-lg font-bold text-sky-200 border-b border-sky-800 pb-2">紹介文</h2>
      <p class="leading-loose text-base md:text-lg whitespace-pre-line text-sky-100">
ボール遊びとヨーグルトが大好きです。
初めて会う人には少し緊張しますが、慣れるとしっぽを振って近寄ってきます。
散歩が大好きで、公園では元気いっぱい走ります。
優しく接してくださる家族との出会いを待っています。
      </p>
    </div>
      

    <!-- 2. 写真 -->
    <div class="w-full flex justify-center">
      <div class="w-[900px] bg-sky-950/50 p-3 rounded-2xl border-2 border-sky-800/80 shadow-xl mx-auto">
        <div class="rounded-xl overflow-hidden w-full bg-sky-900/30">
          <img
            src="dog_2.jpg"
            alt="こうめ"
            class="w-full h-auto object-cover"
          />
        </div>
        <p class="text-center text-sm text-sky-400 mt-2">
          こうめくんの日常写真（dog_2.jpg）
        </p>
      </div>
    </div>

    <!-- 3. 名前：下・小 -->
    <header class="text-center pt-2">
      <h1 class="text-5xl md:text-6xl font-bold tracking-wide text-sky-200">
        こうめ
      </h1>
    </header>
<!-- 2. 年齢・性別 -->
    <div class="border border-sky-800 bg-sky-950/60 p-5 rounded-2xl text-center space-y-1">
      <p class="text-sky-300 text-xs">プロフィール</p>
      <div class="text-2xl font-bold tracking-widest text-white flex justify-center gap-6">
        <span>年齢：3歳</span>
        <span>性別：男の子</span>
      </div>
    </div>
    <!-- 4. ボタン -->
    <div class="text-center pt-2">
      <button onclick="alert('お気軽にお問い合わせください。スタッフがご案内いたします。🐾')" class="inline-flex items-center justify-center bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-bold px-10 py-3 rounded-full shadow-lg transition duration-200 text-base border border-sky-400 w-full md:w-auto">
        この子に会ってみる
      </button>
    </div>

  </div>
</body>
</html>
